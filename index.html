<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card pokemon</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="Scarlet Icon.jpg" type="image/x-icon">
</head>
<body>
    <main class="container">
        <article class="card">
            <img src="Scarlet´s Banner.jpg"
            alt="fondocard"
            class="card-header">
            <div class="card-body">
                <div class="card-body-contentimg">
                    <img src="Scarlet Icon.jpg.png" alt="Scarlet Witch" class="card-body-contentimg-img"
                    width="200">

                </div>
               <h1 class="card-body-title">
                Scarlet Witch
                <span>#3</span>
               </h1>
               <p class="card-body-text">
                coleccionable
               </p>

            </div>
            <div class="card-footer">
                <div class="card-footer-poder">
                    <h3>Poder</h3>
                    <img src="Chaos Icon.png"
                    alt="Chaos Magic" width="35">
                </div>
                <div class="card-footer-poder">
                    <h3>Resistencia</h3>
                    <img src="Concept.png"
                    alt="Fisico" width="35">
                </div>
                <div class="card-footer-poder">
                    <h3>Bonus</h3>
                    <img src="Telepathy.jpg"
                    alt="Magical Telepath" width="35">
                </div>

            </div>

        </article>
        
    </main>
</body>
</html>
